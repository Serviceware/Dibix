parameters:
- name: operatingSystem
  type: string
  values:
  - Linux
  - macOS
  - Windows
- name: configuration
  type: string
  values:
  - Debug
  - Release
- name: runtimeIdentifier
  type: string
  values:
  - linux-x64
  - osx-x64
  - win-x64
- name: codeCoverageEngine
  type: string
  values:
  - Native
  - Cobertura
- name: publishReadyToRun
  type: boolean
  default: true

steps:
- template: install-dotnet-sdk.yml

- template: restore.yml
  parameters:
    publishReadyToRun: ${{ parameters.publishReadyToRun }}
    runtimeIdentifier: ${{ parameters.runtimeIdentifier }}

- template: build.yml
  parameters:
    configuration: ${{ parameters.configuration }}
    runtimeIdentifier: ${{ parameters.runtimeIdentifier }}

- template: test.yml
  parameters:
    operatingSystem: ${{ parameters.operatingSystem }}
    configuration: ${{ parameters.configuration }}
    codeCoverageEngine: ${{ parameters.codeCoverageEngine }}

- ${{ if eq(parameters.operatingSystem, 'Linux') }}:
  - template: pack.yml
    parameters:
      configuration: ${{ parameters.configuration }}

- template: publish.yml
  parameters:
    configuration: ${{ parameters.configuration }}
    runtimeIdentifier: ${{ parameters.runtimeIdentifier }}
    publishReadyToRun: ${{ parameters.publishReadyToRun }}

- ${{ if eq(parameters.operatingSystem, 'Linux') }}:
  - template: restore.yml
    parameters:
      publishReadyToRun: ${{ parameters.publishReadyToRun }}
      runtimeIdentifier: linux-musl-x64

  - template: publish.yml
    parameters:
      configuration: ${{ parameters.configuration }}
      runtimeIdentifier: linux-musl-x64
      publishReadyToRun: ${{ parameters.publishReadyToRun }}

# Publish all output artifacts at the end. Artifact names must be unique within a build,
# so an artifact published before a failing step would make a rerun of the failed job fail.
- template: publish-artifact.yml
  parameters:
    artifact: Build output ($(operatingSystem))
    folder: build

- template: publish-artifact.yml
  parameters:
    artifact: Test output ($(operatingSystem))
    folder: test

- template: publish-artifact.yml
  parameters:
    artifact: Publish output ($(operatingSystem))
    folder: publish