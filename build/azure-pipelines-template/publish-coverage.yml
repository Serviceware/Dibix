# Runs in the job that executed the tests, so the source paths in the coverage results resolve on this agent.
# ReportGenerator is installed by test.yml and the HTML report is created there as well.
steps:
- script: >
    $(Agent.TempDirectory)/reportgenerator
    -reports:$(Build.ArtifactStagingDirectory)/test/*.xml
    -targetdir:$(Agent.TempDirectory)/coverage
    -reporttypes:Cobertura
  displayName: 🔗 Merge code coverage results (Cobertura.xml)

- task: PublishCodeCoverageResults@1
  displayName: ☑️ Publish code coverage
  inputs:
    codeCoverageTool: Cobertura
    summaryFileLocation: $(Agent.TempDirectory)/coverage/Cobertura.xml
    reportDirectory: $(Build.ArtifactStagingDirectory)/test/Report
    pathToSources: $(Build.SourcesDirectory)
    failIfCoverageEmpty: true