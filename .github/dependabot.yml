version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /src/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 999
    rebase-strategy: disabled
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      # Patch updates are released monthly on the second Tuesday of each month, also known as Patch Tuesday
      # https://dotnet.microsoft.com/en-us/platform/support/policy
      day: wednesday
    open-pull-requests-limit: 999
    rebase-strategy: disabled
    ignore:
      - dependency-name: '*'
        update-types: 
          - version-update:semver-major
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 999
    rebase-strategy: disabled
    ignore:
      # MSBuild only ships implementation assemblies for net472 and for the TFM of the SDK its band ships in.
      # 18.9.x is the band of the .NET 10 SDK (net10.0) and remains so for the rest of its lifetime, since
      # 10.0.4xx is the last feature band. 18.10+ belongs to the .NET 11 SDK (net11.0) and therefore only
      # resolves a reference assembly on net10.0. Since Dibix.Sdk.Cli redistributes the MSBuild assemblies to
      # drive DacFx tasks outside of MSBuild, packing it then fails with NU5019.
      # Dibix follows LTS only, so .NET 11 (STS) is skipped entirely, just like 17.11.x was kept throughout
      # .NET 8. Remove this once the SDK projects target the next LTS (.NET 12) and pick the MSBuild band that
      # ships with it.
      # Patch updates within 18.9.x are still offered, so servicing and security fixes keep flowing.
      - dependency-name: Microsoft.Build.Utilities.Core
        versions: ['>=18.10.0']
      # Dibix.Sdk.Generators and Dibix.Testing.Generators are Roslyn source generators, so they must not reference
      # a newer compiler than the one running the build, which is shipped with the SDK pinned in global.json.
      # The .NET 10 SDK (10.0.4xx is its last feature band) runs compiler 5.9.0.0, so anything newer fails with
      # CS9057 ("references version '5.12.0.0' of the compiler, which is newer than the currently running
      # version '5.9.0.0'"). Like MSBuild above, newer compilers from .NET 11 (STS) are skipped entirely.
      # Remove this once global.json moves to the next LTS (.NET 12). Patch updates within 5.9.x are still offered.
      - dependency-name: Microsoft.CodeAnalysis.*
        versions: ['>=5.10.0']
    groups:
      # Microsoft.CodeAnalysis.CSharp depends on Microsoft.CodeAnalysis.Analyzers, so bump them together
      # instead of getting a single and a combined PR for the same update.
      roslyn:
        patterns:
          - Microsoft.CodeAnalysis.*
      dotnet-packages-aligned-with-sdk-version:
        patterns:
          - Microsoft.AspNetCore.*
          - Microsoft.Extensions.*
          - System.Diagnostics.EventLog
          - System.IO.Packaging
          - System.Linq.AsyncEnumerable
          - System.Net.Http.Json
      mstest:
        patterns:
          - Microsoft.NET.Test.Sdk
          - MSTest.TestAdapter
          - MSTest.TestFramework